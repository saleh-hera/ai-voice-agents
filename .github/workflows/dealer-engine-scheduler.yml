name: Dealer Engine Scheduler

# Runs the reminder/review-request scheduler against the deployed backend's
# database. Mirrors the pattern used by daily-apollo-lead-loader.yml.
# Requires the backend to be deployed somewhere reachable (Railway/Render/VPS)
# with DATABASE_URL pointing at the SAME database the running API uses —
# running this against a different DB than the live app does nothing useful.

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch: {}

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run scheduled modules (reminders, review requests)
        env:
          DATABASE_URL: ${{ secrets.DEALER_ENGINE_DATABASE_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        run: python -m app.scheduler
